# Exemple chiffré de taches/1_offre_bloc_spot.md (journée fictive) : bloc + spot = 270 €
period: {start: 2026-11-16, end: 2026-11-16, timezone: Europe/Paris}
site:
  adapter: csv_generic
  load: ../data/exemple_bloc_spot.csv
  mapping: ../data/exemple_bloc_spot.mapping.yaml
market:
  prices:
    adapter: csv_generic
    path: ../data/exemple_bloc_spot.csv
    mapping: ../data/exemple_bloc_spot.mapping.yaml
  offers:
    - {type: spot}
    - {type: fixed, price_eur_mwh: 80}
    - {type: bloc_spot, bloc_kw: 100, bloc_price_eur_mwh: 80}
