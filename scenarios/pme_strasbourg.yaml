# PME de bureaux FICTIVE à Strasbourg, année 2025. Même profil que pme_bureaux.yaml, mais PV
# calculé d'après le rayonnement réel du Grand Est (RTE/ODRÉ). Chauffage supposé non électrique.
period: {start: 2025-01-01, end: 2025-12-31, timezone: Europe/Paris}

site:
  adapter: bottom_up
  seed: 7
  appliances:
    - {type: schedule,  name: talon_serveurs_froid, power_w: 15000, windows: [[0, 24]]}
    - {type: schedule,  name: bureaux_clim_eclairage, power_w: 45000, windows: [[8, 19]], days: [0, 1, 2, 3, 4]}
    - {type: schedule,  name: cantine, power_w: 30000, windows: [[11.5, 13.5]], days: [0, 1, 2, 3, 4]}
    - {type: daily_run, name: recharge_vehicules, power_w: 22000, duration_h: 2, earliest_h: 9, latest_end_h: 18, days: [0, 1, 2, 3, 4]}

market:
  prices: {adapter: energy_charts, bzn: FR}
  offers:
    - {type: spot}
    - {type: fixed, price_eur_mwh: 80}
    - {type: bloc_spot, bloc_kw: 30, bloc_price_eur_mwh: 80}

pv: {peak_kw: 100, source: odre_irradiance, region: 44, lat: 48.58, lon: 7.75, efficiency: 0.20, pmax_w_m2: 250}
battery: {capacity_kwh: 100, c_rate: 0.5, round_trip_efficiency: 0.90, soc_min: 0.10, soc_max: 0.90, cycle_life: 5000}
strategy: {type: price_threshold}
grid: {subscribed_kw: 90, penalty_eur_per_kw: 10}   # pénalité INVENTÉE
