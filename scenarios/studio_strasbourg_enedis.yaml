# Studio FICTIF à Strasbourg, année 2025, avec une courbe de charge RÉELLE (open data Enedis) :
# segment résidentiel option base, 3 à 6 kVA, France (pas de maille régionale ≤ 36 kVA) ; 4 300 kWh/an comme le studio du point du 23/11.
# Même équipement, même marché et mêmes choix que studio_strasbourg.yaml ; seule la consommation change.
period: {start: 2025-01-01, end: 2025-12-31, timezone: Europe/Paris}

site:
  adapter: enedis_open   # courbe RÉELLE d'un site moyen du segment, mise à l'échelle de annual_kwh
  dataset: conso-inf36
  profile: "RES1 (+ RES1WE)"
  power_range: "P2: ]3-6] kVA"
  annual_kwh: 4300

market:
  prices: {adapter: energy_charts, bzn: FR}
  offers:
    # CHOIX surcoût 75 €/MWh par kWh acheté (hors TVA) : acheminement TURPE ≈ 45 + accise ≈ 31 (ménage).
    # CHOIX revente du surplus 11 €/MWh : obligation d'achat EDF OA ≤ 9 kWc depuis juin 2026.
    - {type: spot, export_price_eur_mwh: 11, import_surcharge_eur_mwh: 75}
    - {type: fixed, price_eur_mwh: 80, export_price_eur_mwh: 11, import_surcharge_eur_mwh: 75}

# PV d'après le rayonnement solaire réel du Grand Est (ODRÉ), chaîne du plan :
# surface = kWc ÷ 250 W/m², P = rayonnement × 20 % × surface
pv: {peak_kw: 3, source: odre_irradiance, region: 44, lat: 48.58, lon: 7.75, efficiency: 0.20, pmax_w_m2: 250}
battery: {capacity_kwh: 5, c_rate: 0.5, cycle_life: 5000}
strategy: {type: price_threshold}
