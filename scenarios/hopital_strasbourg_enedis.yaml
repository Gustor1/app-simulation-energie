# Hôpital FICTIF à Strasbourg, année 2025, avec une courbe de charge RÉELLE (open data Enedis) :
# segment tertiaire Grand Est, 250 à 1000 kVA (pas de catégorie « hôpital » dans l'open data).
# Même équipement, même marché et mêmes choix que hopital_strasbourg.yaml ; seule la consommation change.
period: {start: 2025-01-01, end: 2025-12-31, timezone: Europe/Paris}

site:
  adapter: enedis_open   # courbe RÉELLE d'un site moyen du segment, mise à l'échelle de annual_kwh
  dataset: conso-sup36-region
  region: 44
  sector: "S3: Tertiaire"
  power_range: "P4: ]250-1000] kVA"
  annual_kwh: 2370910

market:
  prices: {adapter: energy_charts, bzn: FR}
  # CHOIX surcoût 50 €/MWh par kWh acheté (hors TVA) : acheminement + accise d'un client pro (ordre de grandeur).
  # Surplus revendu au spot (via un agrégateur).
  offers:
    - {type: spot, import_surcharge_eur_mwh: 50}
    - {type: fixed, price_eur_mwh: 80, import_surcharge_eur_mwh: 50}
    - {type: bloc_spot, bloc_kw: 200, bloc_price_eur_mwh: 80, import_surcharge_eur_mwh: 50}

pv: {peak_kw: 250, source: odre_irradiance, region: 44, lat: 48.58, lon: 7.75, efficiency: 0.20, pmax_w_m2: 250}
battery: {capacity_kwh: 250, c_rate: 0.5, round_trip_efficiency: 0.90, soc_min: 0.10, soc_max: 0.90, cycle_life: 5000}
strategy: {type: price_threshold, peak_limit_kw: 400, peak_reserve_kwh: 60}   # arbitrage + écrêtage des pointes, 30 % de la capacité utile en réserve
grid: {subscribed_kw: 400, penalty_eur_per_hour: 12.41}   # CHOIX règle CMDPS C4 du TURPE : 12,41 € par heure de dépassement
